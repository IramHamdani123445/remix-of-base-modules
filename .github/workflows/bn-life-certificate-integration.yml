# BN Life Certificates — seeded database integration harness.
#
# Provisions a clean Postgres, applies every migration from zero, then runs
# the seeded transaction/rollback harness in
# supabase/tests/bn/life_certificate_integration.sql.
#
# The harness is authoritative: it seeds its own identity, permissions,
# record scope and business fixtures, executes the real worklist RPC under
# an `authenticated` session, and drives the communication adapter end to
# end. A skipped scenario or a missing PASS marker fails the build.
name: bn-life-certificate-integration

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/bn/**"
      - "supabase/verify/bn_life_certificate_**"
      - "supabase/functions/bn-life-certificate-**/**"
      - "supabase/functions/bn-communication-adapter/**"
      - "src/pages/bn/servicing/**"
      - "src/services/bn/lifeCertificate**"
      - "src/services/bn/bnCommunicationAdapterService.ts"
      - "src/components/bn/life-certificates/**"
      - "src/__tests__/bn/servicing/**"
      - "scripts/bn/**"
      - ".github/workflows/bn-life-certificate-integration.yml"
  push:
    branches:
      - main
      - development
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/bn/**"
      - "src/pages/bn/servicing/**"
      - "src/services/bn/lifeCertificate**"
      - "src/__tests__/bn/servicing/**"
      - ".github/workflows/bn-life-certificate-integration.yml"
  workflow_dispatch:

jobs:
  life-certificate-db:
    name: Seeded Life Certificate database harness
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U postgres && break
            sleep 1
          done

      - name: Bootstrap Supabase-compatible schema, roles and auth stubs
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS "pgcrypto";
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS "pg_trgm";
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE SCHEMA IF NOT EXISTS supabase_functions;
          CREATE SCHEMA IF NOT EXISTS realtime;
          CREATE SCHEMA IF NOT EXISTS vault;
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            instance_id uuid,
            aud text,
            role text,
            email text,
            encrypted_password text,
            email_confirmed_at timestamptz,
            raw_app_meta_data jsonb DEFAULT '{}'::jsonb,
            raw_user_meta_data jsonb DEFAULT '{}'::jsonb,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          -- Session-aware stubs: the harness sets request.jwt.claims, so
          -- auth.uid() resolves to the seeded actor exactly as in Supabase.
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $fn$
            SELECT NULLIF(current_setting('request.jwt.claims', true)::jsonb ->> 'sub', '')::uuid
          $fn$;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS $fn$
            SELECT COALESCE(current_setting('request.jwt.claims', true)::jsonb ->> 'role', 'anon')
          $fn$;
          CREATE OR REPLACE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS $fn$
            SELECT COALESCE(NULLIF(current_setting('request.jwt.claims', true), '')::jsonb, '{}'::jsonb)
          $fn$;
          DO $$ BEGIN CREATE ROLE anon NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE authenticated NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE service_role NOLOGIN BYPASSRLS; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;
          GRANT SELECT ON auth.users TO service_role;
          SQL

      - name: Apply every migration from zero in order
        run: |
          shopt -s nullglob
          set -euo pipefail
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "==> Applying: $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Verify Life Certificate effective grants
        run: psql -v ON_ERROR_STOP=1 -f supabase/verify/bn_life_certificate_effective_grants.sql

      - name: Run seeded Life Certificate harness
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bn/life_certificate_integration.sql 2>&1 \
            | tee /tmp/bn-lc-harness.log
          if grep -qi 'SKIP' /tmp/bn-lc-harness.log; then
            echo "FAIL: harness skipped a scenario"; exit 1
          fi
          grep -q 'BN_LC_HARNESS_RESULT: PASS' /tmp/bn-lc-harness.log \
            || { echo "FAIL: harness did not report PASS"; exit 1; }

      - name: Upload harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bn-life-certificate-harness-log
          path: /tmp/bn-lc-harness.log
          if-no-files-found: warn

  life-certificate-ui:
    name: Life Certificate route and service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Benefits servicing suite
        run: bunx vitest run src/__tests__/bn/servicing/
