# BN Life Certificates — seeded clean-database integration harness.
#
# Provisions a clean PostgreSQL 15 database via
# scripts/ci/bootstrap-supabase-test-db.sh (Supabase substrate +
# supabase/baseline/schema.sql + every migration after the baseline cutoff),
# then runs the seeded transaction/rollback harness in
# supabase/tests/bn/life_certificate_integration.sql.
# See supabase/baseline/README.md for why a baseline replaces from-zero replay.
#
# Gates, all mandatory:
#   1. supabase/verify/bn_life_certificate_effective_grants.sql
#        -> exactly one  BN_LC_GRANTS_RESULT: PASS
#   2. supabase/tests/bn/life_certificate_integration.sql
#        -> exactly one  BN_LC_HARNESS_RESULT: PASS, exact SKIP marker rejected
#   3. dark-launch postflight (bn_life_certificate.actions_enabled = false)
#   4. zero synthetic fixture residue after rollback
#   5. focused servicing suite and `bunx tsc --noEmit -p tsconfig.app.json`
#
# No SUPABASE_ACCESS_TOKEN is exported and no remote project is ever linked.
name: bn-life-certificate-integration

env:
  BN_TEST_LIVE_PROJECT_REF_DENYLIST: xynceskeiiisiefqlgxo

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/baseline/**"
      - "supabase/tests/bn/life_certificate_**"
      - "supabase/verify/bn_life_certificate_**"
      - "supabase/functions/bn-life-certificate-**/**"
      - "supabase/functions/bn-communication-adapter/**"
      - "src/pages/bn/servicing/**"
      - "src/services/bn/lifeCertificate**"
      - "src/services/bn/bnCommunicationAdapterService.ts"
      - "src/components/bn/life-certificates/**"
      - "src/__tests__/bn/servicing/**"
      - "scripts/bn/**"
      - "scripts/ci/**"
      - ".github/workflows/bn-life-certificate-integration.yml"
  push:
    branches:
      - main
      - development
    paths:
      - "supabase/migrations/**"
      - "supabase/baseline/**"
      - "supabase/tests/bn/life_certificate_**"
      - "supabase/verify/bn_life_certificate_**"
      - "src/pages/bn/servicing/**"
      - "src/services/bn/lifeCertificate**"
      - "src/__tests__/bn/servicing/**"
      - "scripts/ci/**"
      - ".github/workflows/bn-life-certificate-integration.yml"
  workflow_dispatch:

jobs:
  life-certificate-db:
    name: Seeded Life Certificate database harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U postgres && break
            sleep 1
          done

      - name: Build clean database (bootstrap + baseline + forward migrations)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          chmod +x scripts/ci/bootstrap-supabase-test-db.sh
          scripts/ci/bootstrap-supabase-test-db.sh

      - name: Verify Life Certificate effective grants
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/verify/bn_life_certificate_effective_grants.sql 2>&1 \
            | tee /tmp/bn-lc-grants.log
          if grep -Eq 'BN_LC_GRANTS_RESULT:[[:space:]]*SKIP' /tmp/bn-lc-grants.log; then
            echo "FAIL: grant verifier reported SKIP"; exit 1
          fi
          test "$(grep -c 'BN_LC_GRANTS_RESULT: PASS' /tmp/bn-lc-grants.log)" -eq 1 \
            || { echo "FAIL: verifier did not report exactly one PASS marker"; exit 1; }

      - name: Run seeded Life Certificate harness
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bn/life_certificate_integration.sql 2>&1 \
            | tee /tmp/bn-lc-harness.log
          if grep -Eq 'BN_LC_HARNESS_RESULT:[[:space:]]*SKIP' /tmp/bn-lc-harness.log; then
            echo "FAIL: harness reported SKIP"; exit 1
          fi
          test "$(grep -c 'BN_LC_HARNESS_RESULT: PASS' /tmp/bn-lc-harness.log)" -eq 1 \
            || { echo "FAIL: harness did not report exactly one PASS marker"; exit 1; }
          grep -q 'ROLLBACK' /tmp/bn-lc-harness.log \
            || { echo "FAIL: harness did not roll back"; exit 1; }

      - name: Assert the module is still dark-launched
        run: |
          set -euo pipefail
          state="$(psql -At -v ON_ERROR_STOP=1 \
            -c "SELECT actions_enabled FROM public.app_modules WHERE name = 'bn_life_certificate';")"
          [ "$state" = "f" ] || { echo "FAIL: module activated in CI (actions_enabled=$state)"; exit 1; }

      - name: Assert no fixture residue after rollback
        run: |
          set -euo pipefail
          for t in $(psql -At -v ON_ERROR_STOP=1 -c "SELECT c.relname FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind = 'r' AND c.relname LIKE 'bn\\_life\\_certificate%';"); do
            rows="$(psql -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.$t;")"
            [ "$rows" = "0" ] || { echo "FAIL: fixture residue in $t ($rows rows)"; exit 1; }
          done

      - name: Upload harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bn-life-certificate-harness-log
          path: |
            /tmp/bn-lc-grants.log
            /tmp/bn-lc-harness.log
          if-no-files-found: warn

  life-certificate-ui:
    name: Life Certificate route, service tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Benefits servicing suite
        run: bunx vitest run src/__tests__/bn/servicing/
      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: bunx tsc --noEmit -p tsconfig.app.json
