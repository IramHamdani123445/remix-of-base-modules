# BN Award Suspension — seeded clean-database integration harness.
#
# Replaces the previous full-history `supabase db reset` replay, which is
# impossible from zero (see supabase/baseline/README.md): the database is
# built from the Supabase substrate + the reviewed baseline schema + every
# migration after the cutoff, exactly like the Life Certificate workflow.
#
# Gates, all mandatory:
#   1. supabase/verify/bn_award_suspension_effective_grants.sql
#   2. supabase/tests/bn/award_suspension_integration.sql -> BN_SUSP_HARNESS_RESULT: PASS
#   3. static/unit suites and typecheck
name: BN Suspension Integration (Clean Database)

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - develop
      - 'bn/**'
    paths:
      - '.github/workflows/bn-suspension-integration.yml'
      - 'supabase/migrations/**'
      - 'supabase/baseline/**'
      - 'supabase/verify/bn_award_suspension_**'
      - 'supabase/tests/bn/award_suspension_**'
      - 'supabase/test-support/**'
      - 'scripts/ci/**'
      - 'scripts/bn/activate-award-suspension-test.sh'
      - 'scripts/bn/__tests__/**'
      - 'src/pages/bn/servicing/award-suspension/**'
      - 'src/services/bn/awardSuspension*.ts'
      - 'src/__tests__/bn/**'
      - 'package.json'
  pull_request:
    paths:
      - '.github/workflows/bn-suspension-integration.yml'
      - 'supabase/migrations/**'
      - 'supabase/baseline/**'
      - 'supabase/verify/bn_award_suspension_**'
      - 'supabase/tests/bn/award_suspension_**'
      - 'supabase/test-support/**'
      - 'scripts/ci/**'
      - 'scripts/bn/activate-award-suspension-test.sh'
      - 'scripts/bn/__tests__/**'
      - 'src/pages/bn/servicing/award-suspension/**'
      - 'src/services/bn/awardSuspension*.ts'
      - 'src/__tests__/bn/**'
      - 'package.json'

# No SUPABASE_ACCESS_TOKEN is ever exported and no remote link is performed.
env:
  BN_TEST_LIVE_PROJECT_REF_DENYLIST: xynceskeiiisiefqlgxo

jobs:
  suspension-db:
    name: Seeded Award Suspension database harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U postgres && break
            sleep 1
          done

      - name: Build clean database (bootstrap + baseline + forward migrations)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          chmod +x scripts/ci/bootstrap-supabase-test-db.sh
          scripts/ci/bootstrap-supabase-test-db.sh

      - name: Verify Award Suspension effective grants
        run: psql -v ON_ERROR_STOP=1 -f supabase/verify/bn_award_suspension_effective_grants.sql

      - name: Run seeded Award Suspension harness
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bn/award_suspension_integration.sql 2>&1 \
            | tee /tmp/bn-susp-harness.log
          if grep -Eq 'BN_SUSP_HARNESS_RESULT:[[:space:]]*SKIP' /tmp/bn-susp-harness.log; then
            echo "FAIL: harness reported SKIP"
            exit 1
          fi
          test "$(grep -c 'BN_SUSP_HARNESS_RESULT: PASS' /tmp/bn-susp-harness.log)" -eq 1 \
            || { echo "FAIL: harness did not report exactly one PASS marker"; exit 1; }


      - name: Assert the module is still dark-launched
        run: |
          set -euo pipefail
          state="$(psql -At -v ON_ERROR_STOP=1 \
            -c "SELECT actions_enabled FROM public.app_modules WHERE name = 'bn_award_suspension';")"
          [ "$state" = "f" ] || { echo "FAIL: module activated in CI (actions_enabled=$state)"; exit 1; }

      - name: Assert no fixture residue after rollback
        run: |
          set -euo pipefail
          for t in $(psql -At -v ON_ERROR_STOP=1 -c "SELECT c.relname FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind = 'r' AND (c.relname LIKE 'bn\\_award\\_suspension%' OR c.relname LIKE 'bn\\_award\\_reinstatement%' OR c.relname LIKE 'bn\\_susp\\_%');"); do
            rows="$(psql -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.$t;")"
            [ "$rows" = "0" ] || { echo "FAIL: fixture residue in $t ($rows rows)"; exit 1; }
          done

      - name: Upload harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bn-suspension-harness-log
          path: /tmp/bn-susp-harness.log
          if-no-files-found: warn

  suspension-static:
    name: Award Suspension static, unit and guard tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run BN suspension static tests
        run: bun run test:bn-suspension-static
      - name: Run activation-script guard tests
        run: bash scripts/bn/__tests__/activate-award-suspension-test.spec.sh
      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: bunx tsc --noEmit -p tsconfig.app.json
