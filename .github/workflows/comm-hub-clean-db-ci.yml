# Checkpoint A foundation for the Communication Hub clean-database CI.
#
# This workflow protects against migrations that only apply on top of the
# existing shared database. It provisions a clean Postgres instance and
# applies every migration in order from zero. Additional gates (Supabase
# type verification, RPC smoke tests, Edge contract tests, Vitest, and an
# uploaded evidence artifact) land in Checkpoint C — but the from-zero
# protection begins now.
#
# Triggers on Communication Hub–adjacent changes, on the main branch, and
# via manual dispatch.
name: comm-hub-clean-db-ci

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/comm-hub-**/**"
      - "supabase/functions/omni-comms-**/**"
      - "src/platform/communication-hub/**"
      - "src/platform/omni-comms/**"
      - "src/pages/admin/communicationHub/**"
      - "src/pages/admin/omnichannel-communications/**"
      - "src/__tests__/comm-hub/**"
      - "src/__tests__/omni-comms/**"
      - "scripts/omni-comms/**"
      - ".github/workflows/comm-hub-clean-db-ci.yml"
  push:
    branches:
      - main
      - development
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/comm-hub-**/**"
      - "supabase/functions/omni-comms-**/**"
      - "src/platform/communication-hub/**"
      - "src/platform/omni-comms/**"
      - "src/pages/admin/communicationHub/**"
      - "src/pages/admin/omnichannel-communications/**"
      - "src/__tests__/comm-hub/**"
      - "src/__tests__/omni-comms/**"
      - "scripts/omni-comms/**"
      - ".github/workflows/comm-hub-clean-db-ci.yml"
  workflow_dispatch:

jobs:
  omni-comms-architecture:
    name: Omni-Comms architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run architecture boundary checks
        run: bun run check:omni-comms-architecture
      - name: Run Omni-Comms vitest suite
        run: bunx vitest run src/__tests__/omni-comms/
  migrate-from-zero:
    name: Apply every migration from zero
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U postgres && break
            sleep 1
          done

      - name: Bootstrap Supabase-compatible schema + extensions + auth stubs
        run: |
          psql <<'SQL'
          CREATE EXTENSION IF NOT EXISTS "pgcrypto";
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS "pg_trgm";
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE SCHEMA IF NOT EXISTS supabase_functions;
          CREATE SCHEMA IF NOT EXISTS realtime;
          CREATE SCHEMA IF NOT EXISTS vault;
          -- minimal auth.users stub so migrations that reference it succeed
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            email text,
            raw_user_meta_data jsonb DEFAULT '{}'::jsonb,
            created_at timestamptz NOT NULL DEFAULT now()
          );
          -- auth.uid()/auth.role() stubs — return NULL so admin-gated RPCs
          -- fail closed in CI (exactly the behaviour we want for smoke tests).
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS $$ SELECT NULL::text $$;
          CREATE OR REPLACE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS $$ SELECT '{}'::jsonb $$;
          -- roles Supabase expects
          DO $$ BEGIN CREATE ROLE anon NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE authenticated NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE service_role NOLOGIN BYPASSRLS; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          SQL

      - name: Apply every migration from zero in order
        run: |
          shopt -s nullglob
          set -euo pipefail
          count=0
          for f in $(ls supabase/migrations/*.sql 2>/dev/null | sort); do
            echo "==> Applying: $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
            count=$((count+1))
          done
          echo "Applied $count migrations"
          echo "APPLIED_MIGRATIONS=$count" >> "$GITHUB_ENV"

      - name: Schema sanity — list migration files applied
        run: |
          mkdir -p ci-artifacts
          ls supabase/migrations/*.sql 2>/dev/null | sort > ci-artifacts/applied_migrations.txt || true
          psql -At -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" > ci-artifacts/public_table_count.txt

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comm-hub-migration-from-zero-${{ github.run_id }}
          path: ci-artifacts/
          retention-days: 14

  typecheck-and-tests:
    name: Typecheck + Communication Hub tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile || bun install
      - name: Typecheck
        run: bunx tsc --noEmit || true # non-blocking for foundation; Checkpoint C makes this blocking
      - name: Communication Hub Vitest
        run: bunx vitest run src/__tests__/comm-hub || true # non-blocking for foundation; Checkpoint C makes this blocking
