name: BN Overpayment Integration (PG15)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'src/services/bn/overpayments/**'
      - 'src/types/bn/overpayments/**'
      - 'src/pages/bn/servicing/OverpaymentRecovery.tsx'
      - 'scripts/ci/**'
      - 'docs/bn/BN_OVERPAYMENT_IMPLEMENTATION_MATRIX.md'
      - 'docs/bn/BN_MASTER_COMPLETION_REGISTER.*'
      - '.github/workflows/bn-overpayment-integration.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'src/services/bn/overpayments/**'
      - 'src/types/bn/overpayments/**'
      - 'src/pages/bn/servicing/OverpaymentRecovery.tsx'
      - 'scripts/ci/**'
      - '.github/workflows/bn-overpayment-integration.yml'
  workflow_dispatch:

jobs:
  overpayment-certification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap disposable Supabase-shaped database
        run: bash scripts/ci/bootstrap-supabase-test-db.sh

      - name: Environment marker guard (never certify against production)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -Atc \
            "select upper(environment_kind) from public.platform_environment_marker where id = true" \
            | tee /tmp/op-env.log
          grep -qx 'CI' /tmp/op-env.log

      - name: Effective-grant verifier (B7)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/verify/bn_overpayment_effective_grants.sql 2>&1 | tee /tmp/op-grants.log
          test "$(grep -c 'BN_OP_GRANTS_RESULT: PASS' /tmp/op-grants.log)" -eq 1
          ! grep -q 'BN_OP_GRANTS_RESULT: FAIL' /tmp/op-grants.log

      - name: Lifecycle integration harness (B12/B13)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bn/overpayment_integration.sql 2>&1 | tee /tmp/op-harness.log
          test "$(grep -c 'BN_OP_HARNESS_RESULT: PASS' /tmp/op-harness.log)" -eq 1
          ! grep -q 'BN_OP_HARNESS_RESULT: FAIL' /tmp/op-harness.log
          ! grep -q 'SKIP' /tmp/op-harness.log

      - name: Dark-launch postflight (rollout state and actions)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -Atc \
            "select rollout_state || ':' || actions_enabled from public.app_modules where name = 'bn_overpayments'" \
            | tee /tmp/op-dark.log
          grep -qx 'internal_pilot:false' /tmp/op-dark.log

      - name: Fixture residue gate (B13)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -Atc "
            select coalesce(sum(n), 0) from (
              select (xpath('/row/c/text()',
                query_to_xml(format('select count(*) as c from %I.%I', schemaname, tablename),
                false, true, '')))[1]::text::bigint as n
              from pg_tables where schemaname = 'public' and tablename like 'bn\_op\_%'
            ) t" | tee /tmp/op-residue.log
          grep -qx '0' /tmp/op-residue.log

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Overpayment boundary + invariant tests
        run: bunx vitest run src/__tests__/bn/gap-modules/overpayments

      - name: Typecheck
        run: bunx tsgo --noEmit -p tsconfig.app.json

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bn-overpayment-certification-${{ github.sha }}
          if-no-files-found: error
          path: |
            /tmp/op-env.log
            /tmp/op-grants.log
            /tmp/op-harness.log
            /tmp/op-dark.log
            /tmp/op-residue.log
